name: Deploy Policlinica

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. FRONTEND - BUILD
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # Comprueba que Vite realmente haya insertado la URL de producción.
      # Si todavía aparece localhost, detenemos el deploy.
      - name: Verify frontend API URL
        working-directory: frontend
        run: |
          echo "Verificando URL de API dentro del build..."

          if grep -R "localhost:8000" dist/; then
            echo "ERROR: El build contiene localhost:8000"
            exit 1
          fi

          if grep -R "api-policlinica.marioalabi.com" dist/; then
            echo "OK: El frontend contiene la API de producción"
          else
            echo "ERROR: No se encontró la API de producción en dist/"
            exit 1
          fi


      # ============================================================
      # 3. PREPARAR BACKEND
      # ============================================================

      # No copiamos archivos/directorios persistentes.
      #
      # .env             -> configuración del servidor
      # storage          -> logs/uploads/cache del servidor
      # bootstrap/cache  -> permisos especiales para Apache
      # vendor           -> dependencias PHP ya instaladas
      #
      # Tampoco necesitamos tests ni archivos de Git.

      - name: Prepare backend deployment
        run: |
          mkdir -p deploy/backend

          rsync -a \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            --exclude='vendor/' \
            --exclude='tests/' \
            --exclude='.git/' \
            --exclude='.github/' \
            backend/ deploy/backend/


      # ============================================================
      # 4. CONECTAR A HEADSCALE
      # ============================================================

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Headscale
        run: |
          sudo tailscale up \
            --login-server="${{ secrets.HEADSCALE_URL }}" \
            --auth-key="${{ secrets.HEADSCALE_AUTH_KEY }}" \
            --hostname="github-deploy-${{ github.run_id }}"

      - name: Test deployment server
        run: |
          nc -vz \
            "${{ secrets.SFTP_HOST }}" \
            "${{ secrets.SFTP_PORT }}"


      # ============================================================
      # 5. INSTALAR LFTP
      # ============================================================

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp


      # ============================================================
      # 6. DEPLOY FRONTEND
      # ============================================================

      - name: Deploy frontend
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" \
            "sftp://$SFTP_HOST:$SFTP_PORT" <<EOF

          set sftp:auto-confirm yes

          mirror \
            --reverse \
            --delete \
            --verbose \
            frontend/dist/ \
            public_html/

          bye
          EOF


      # ============================================================
      # 7. DEPLOY BACKEND
      # ============================================================

      - name: Deploy backend
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" \
            "sftp://$SFTP_HOST:$SFTP_PORT" <<EOF

          set sftp:auto-confirm yes

          mirror \
            --reverse \
            --delete \
            --verbose \
            --exclude-glob=.env \
            --exclude-glob=storage \
            --exclude-glob=storage/** \
            --exclude-glob=bootstrap/cache \
            --exclude-glob=bootstrap/cache/** \
            --exclude-glob=vendor \
            --exclude-glob=vendor/** \
            --exclude-glob=public/storage \
            --exclude-glob=public/storage/** \
            deploy/backend/ \
            backend/

          bye
          EOF