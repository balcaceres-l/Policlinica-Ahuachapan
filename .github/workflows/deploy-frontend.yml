name: Deploy Frontend Only

on:
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Dependencias
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 4. Compilar
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # 5. Verificar que el build NO tenga localhost
      - name: Verify API URL
        working-directory: frontend
        run: |
          echo "Verificando URL de la API..."

          if grep -R "localhost:8000" dist/; then
            echo "ERROR: El build contiene localhost:8000"
            exit 1
          fi

          if grep -R "api-policlinica.marioalabi.com" dist/; then
            echo "OK: El build contiene la API correcta"
          else
            echo "ERROR: No se encontró la API de producción"
            exit 1
          fi

      # 6. Instalar Tailscale
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      # 7. Entrar a Headscale
      - name: Connect to Headscale
        run: |
          sudo tailscale up \
            --login-server="${{ secrets.HEADSCALE_URL }}" \
            --auth-key="${{ secrets.HEADSCALE_AUTH_KEY }}" \
            --hostname="github-frontend-${{ github.run_id }}"

      # 8. Comprobar servidor
      - name: Test deployment server
        run: |
          nc -vz \
            "${{ secrets.SFTP_HOST }}" \
            "${{ secrets.SFTP_PORT }}"

      # 9. Instalar lftp
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      # 10. Subir únicamente dist/
      - name: Deploy frontend
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" \
            "sftp://$SFTP_HOST:$SFTP_PORT" <<EOF

          set sftp:auto-confirm yes

          mirror \
            --reverse \
            --delete \
            --verbose \
            frontend/dist/ \
            public_html/

          bye
          EOF